<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sweetly Music</title>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Hoja de Estilos Principal -->
    <link rel="stylesheet" href="style.css">
    <!-- Configuración PWA: Manifiesto -->
    <link rel="manifest" href="manifest.json">
    <!-- Color de la barra de estado móvil (Rosa Pastel) -->
    <meta name="theme-color" content="#ffb6c1">
    <!-- Icono para dispositivos Apple -->
    <link rel="apple-touch-icon" href="./assets/Logo Sweetly Music.png">

    <!-- Script de inicialización de tema para evitar parpadeos al abrir -->
    <script>
        (function() {
            const savedTheme = localStorage.getItem('danii_theme') || 'dark';
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            } else {
                document.documentElement.classList.add('dark-mode');
            }
        })();
    </script>
</head>
<body class="dark-theme">
    <div class="app-container">
        
        <!-- Header Estilo App Nativa con Botón Volver -->
        <header class="main-header">
            <div class="header-left">
                <button class="icon-btn hidden" id="backBtn" onclick="goBack()" title="Volver">
                    <i data-lucide="chevron-left"></i>
                </button>
                <h1 id="pageTitle">Biblioteca</h1>
            </div>
            <div class="header-actions">
                <button class="icon-btn" id="themeToggleBtn" title="Cambiar Tema"><i data-lucide="moon"></i></button>
            </div>
        </header>

        <!-- Banner de Saludo Personalizado -->
        <div class="greeting-banner" id="greetingBanner">
            <div class="banner-content">
                <span class="greeting-text" id="greetingText">Buenas noches, Rachel</span>
            </div>
            <img src="" class="banner-artist-img" id="bannerArtistImg" alt="Banner">
        </div>

        <!-- Vistas Principales de la App -->
        <main class="content-area">
            
            <!-- Vista Biblioteca (Home Principal) -->
            <section id="viewLibrary" class="view-section active">
                <div class="menu-list">
                    <div class="menu-item" onclick="switchView('artists')">
                        <i data-lucide="mic" class="menu-icon"></i>
                        <span>Artistas</span>
                        <i data-lucide="chevron-right" class="arrow-icon"></i>
                    </div>
                    <div class="menu-item" onclick="switchView('albums')">
                        <i data-lucide="disc" class="menu-icon"></i>
                        <span>Álbumes</span>
                        <i data-lucide="chevron-right" class="arrow-icon"></i>
                    </div>
                    <div class="menu-item" onclick="switchView('songs')">
                        <i data-lucide="music" class="menu-icon"></i>
                        <span>Canciones</span>
                        <i data-lucide="chevron-right" class="arrow-icon"></i>
                    </div>
                </div>

                <div class="section-title">Recientes</div>
                <div class="top50-carousel" id="top50Container">
                    <!-- Dinámico vía JS -->
                </div>
            </section>

            <!-- Vista Lista de Artistas -->
            <section id="viewArtists" class="view-section">
                <div class="list-container" id="artistList"></div>
            </section>

            <!-- Vista Lista de Álbumes -->
            <section id="viewAlbums" class="view-section">
                <div class="grid-container" id="albumGrid"></div>
            </section>

            <!-- Vista Lista de Canciones Generales -->
            <section id="viewSongs" class="view-section">
                <div class="action-buttons-bar">
                    <button class="action-btn" onclick="playAllSongs(false)"><i data-lucide="play"></i> Reproducir</button>
                    <button class="action-btn" onclick="playAllSongs(true)"><i data-lucide="shuffle"></i> Aleatorio</button>
                </div>
                <div class="list-container" id="songList"></div>
            </section>

            <!-- Vista Detalle de Álbum u Artista -->
            <section id="viewDetail" class="view-section">
                <div class="detail-header">
                    <img id="detailCover" src="" class="detail-cover" alt="Portada">
                    <h2 id="detailTitle">Título</h2>
                    <p id="detailSubtitle">Subtítulo</p>
                    <div class="action-buttons-bar">
                        <button class="action-btn" onclick="playCurrentDetailContext(false)"><i data-lucide="play"></i> Reproducir</button>
                        <button class="action-btn" onclick="playCurrentDetailContext(true)"><i data-lucide="shuffle"></i> Aleatorio</button>
                    </div>
                </div>
                <div class="list-container" id="detailSongList"></div>
            </section>
        </main>

        <!-- Mini Player Flotante (Inicia oculto) -->
        <div class="mini-player hidden" id="miniPlayer" onclick="openFullPlayer()">
            <img id="miniCover" src="https://static.vecteezy.com/system/resources/previews/014/633/536/non_2x/a-note-music-isolated-on-soft-pink-background-free-vector.jpg" alt="Cover">
            <div class="mini-info">
                <div class="mini-title" id="miniTitle">Selecciona una canción</div>
                <div class="mini-artist" id="miniArtist">Sweetly Music</div>
            </div>
            <div class="mini-controls" onclick="event.stopPropagation()">
                <button class="control-btn" onclick="togglePlay()"><i data-lucide="play" id="miniPlayIcon"></i></button>
                <button class="control-btn" onclick="nextSong()"><i data-lucide="skip-forward"></i></button>
            </div>
        </div>

        <!-- Full Player Modal (Pantalla Completa) -->
        <div class="full-player" id="fullPlayer">
            <div class="player-header">
                <button class="icon-btn" onclick="closeFullPlayer()"><i data-lucide="chevron-down"></i></button>
                <div class="header-status">
                    <span>ESCUCHANDO AHORA</span>
                    <span id="playerFormatBadge" class="format-badge">FLAC</span>
                </div>
                <button class="icon-btn" onclick="toggleLyricsView()"><i data-lucide="quote"></i></button>
            </div>

            <div class="player-content">
                <!-- Modo Carátula -->
                <div id="artContainer" class="art-container">
                    <img id="playerCover" src="https://static.vecteezy.com/system/resources/previews/014/633/536/non_2x/a-note-music-isolated-on-soft-pink-background-free-vector.jpg" alt="Album Art">
                </div>

                <!-- Modo Letras -->
                <div id="lyricsContainer" class="lyrics-container hidden">
                    <div id="lyricsText" class="lyrics-text">No hay letras disponibles para esta canción.</div>
                </div>

                <div class="track-details" id="trackDetails">
                    <!-- Miniatura que aparece al lado del título solo en modo letras -->
                    <img id="playerThumb" class="player-thumb-mini hidden" src="" alt="Mini Cover">
                    <div class="track-text-info">
                        <h2 id="playerTitle">Título de la Canción</h2>
                        <p id="playerArtist">Nombre del Artista</p>
                    </div>
                    <button class="icon-btn" onclick="toggleFavoriteCurrent()"><i data-lucide="heart" id="heartIcon"></i></button>
                </div>

                <div class="progress-bar-container">
                    <input type="range" id="progressBar" value="0" min="0" max="100" oninput="seekAudio(this.value)">
                    <div class="time-stamps">
                        <span id="currentTime">0:00</span>
                        <span id="totalTime">0:00</span>
                    </div>
                </div>

                <div class="main-controls">
                    <button class="icon-btn" onclick="toggleShuffle()"><i data-lucide="shuffle" id="shuffleBtn"></i></button>
                    <button class="icon-btn" onclick="prevSong()"><i data-lucide="skip-back"></i></button>
                    <button class="play-btn-large" onclick="togglePlay()"><i data-lucide="play" id="mainPlayIcon"></i></button>
                    <button class="icon-btn" onclick="nextSong()"><i data-lucide="skip-forward"></i></button>
                    <button class="icon-btn" onclick="toggleRepeat()"><i data-lucide="repeat" id="repeatBtn"></i></button>
                </div>
            </div>
        </div>
    </div>

    <!-- Elemento Audio Nativo -->
    <audio id="audioElement"></audio>

    <script src="app.js"></script>
    <link rel="manifest" href="./manifest.json">
</body>
</html>
